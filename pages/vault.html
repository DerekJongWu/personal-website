<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vault - Derek Wu</title>
    <meta name="description" content="Password protected vault of deals"/>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b7cee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                    },
                },
            },
        }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/styles.css"/>
</head>
<body class="bg-background-light dark:bg-background-dark text-[#111418] dark:text-white font-display overflow-x-hidden antialiased">

<!-- Navbar will be loaded here -->
<div id="navbar-container"></div>

<main class="flex-1 flex flex-col items-center w-full">
    <!-- Vault Section (shown only when authenticated) -->
    <section id="vault-content" class="w-full max-w-[1200px] px-6 lg:px-10 py-12 lg:py-20" style="display: none;">
        <div class="flex flex-col gap-4 animate-fade-in-up">
            <div class="flex items-center justify-between mb-4">
                <div>
            <h1 class="text-[#111418] dark:text-white text-5xl sm:text-6xl lg:text-7xl font-black font-display leading-tight tracking-tight">
                Vault
            </h1>
                    <p class="text-[#637588] dark:text-gray-400 text-lg sm:text-xl max-w-3xl leading-relaxed mt-4">
                Password protected. Deals I liked but we didn't invest in.
            </p>
                </div>
                <button 
                    id="vault-logout-btn"
                    class="px-4 py-2 text-sm font-medium text-[#637588] dark:text-gray-400 hover:text-primary dark:hover:text-primary border border-[#e5e7eb] dark:border-gray-800 rounded-lg hover:border-primary transition-all flex items-center gap-2"
                    title="Logout"
                >
                    <span class="material-symbols-outlined text-base">logout</span>
                    Logout
                </button>
            </div>
        </div>
        
        <!-- Vault Content -->
        <div class="mt-12">
            <div id="vault-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Cards loaded dynamically from data/vault/manifest.json -->
            </div>
        </div>
    </section>
</main>

<!-- Footer -->
<footer class="w-full border-t border-[#f0f2f4] dark:border-gray-800 bg-white dark:bg-[#1a2634] py-8">
    <div class="max-w-[1200px] mx-auto px-6 lg:px-10 flex flex-col md:flex-row justify-between items-center gap-4">
        <p class="text-sm text-[#637588] dark:text-gray-400">© 2025 Derek Wu. All rights reserved.</p>
        <div class="flex gap-6">
            <a href="https://www.linkedin.com/in/derekjongwu/" target="_blank" rel="noopener noreferrer" class="text-[#637588] dark:text-gray-400 hover:text-primary transition-colors">LinkedIn</a>
            <a href="https://github.com/DerekJongWu" target="_blank" rel="noopener noreferrer" class="text-[#637588] dark:text-gray-400 hover:text-primary transition-colors">GitHub</a>
        </div>
    </div>
</footer>

<script src="../js/navbar-loader.js"></script>
<script src="../js/main.js"></script>
<script src="../js/vault-auth.js"></script>
<script>
const SECTOR_COLORS = {
    'Cybersecurity': 'bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300',
    'AI':            'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300',
    'Fintech':       'bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-300',
    'Healthcare':    'bg-teal-50 dark:bg-teal-900/30 text-teal-700 dark:text-teal-300',
    'SaaS':          'bg-purple-50 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300',
    'Enterprise':    'bg-orange-50 dark:bg-orange-900/30 text-orange-700 dark:text-orange-300',
    'Consumer':      'bg-pink-50 dark:bg-pink-900/30 text-pink-700 dark:text-pink-300',
    'Developer Tools': 'bg-violet-50 dark:bg-violet-900/30 text-violet-700 dark:text-violet-300',
    'Legal Tech':    'bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300',
};
const DEFAULT_SECTOR_COLOR = 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400';

async function loadVaultCards() {
    try {
        const res = await fetch('../data/vault/manifest.json');
        if (!res.ok) return;
        const companies = await res.json();
        const grid = document.getElementById('vault-grid');
        grid.innerHTML = companies.map(c => {
            const sectorColor = SECTOR_COLORS[c.sector] || DEFAULT_SECTOR_COLOR;
            const statusTags = (c.tags || []).map(tag =>
                `<span class="text-xs px-2 py-0.5 bg-gray-100 dark:bg-gray-800 rounded text-[#637588] dark:text-gray-400">${tag}</span>`
            ).join('');
            return `
            <article class="company-card scroll-animate flex flex-col overflow-hidden rounded-xl bg-white dark:bg-[#1a2634] border border-[#e5e7eb] dark:border-gray-800 shadow-sm hover:shadow-md transition-shadow cursor-pointer"
                     onclick="window.location.href='vault/company.html?slug=${c.slug}'">
                <div class="flex flex-1 flex-col p-6">
                    <div class="flex items-start justify-between mb-3">
                        <h3 class="text-xl font-bold text-[#111418] dark:text-white">${c.name}</h3>
                        ${c.sector ? `<span class="inline-flex items-center px-2 py-1 rounded-md ${sectorColor} text-xs font-medium">${c.sector}</span>` : ''}
                    </div>
                    <p class="text-[#637588] dark:text-gray-400 text-sm leading-relaxed mb-4">${c.description}</p>
                    <div class="mt-auto pt-4 border-t border-[#e5e7eb] dark:border-gray-800">
                        <div class="flex items-center justify-between">
                            <div class="flex flex-wrap gap-1">${statusTags}</div>
                            <span class="material-symbols-outlined text-[#637588] dark:text-gray-400 text-base">arrow_forward</span>
                        </div>
                    </div>
                </div>
            </article>`;
        }).join('');
    } catch (e) {
        console.error('Failed to load vault manifest:', e);
    }
}

document.addEventListener('DOMContentLoaded', loadVaultCards);
</script>
<script>
// Handle logout button
document.addEventListener('DOMContentLoaded', () => {
    const logoutBtn = document.getElementById('vault-logout-btn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('vault_authenticated');
            sessionStorage.removeItem('vault_auth_timestamp');
            window.location.reload();
        });
    }
    
    // Check session timeout periodically (every minute)
    setInterval(() => {
        if (typeof isAuthenticated === 'function' && !isAuthenticated()) {
            // Session expired - reload to show login form
            window.location.reload();
        }
    }, 60000); // Check every minute
});
</script>
</body>
</html>

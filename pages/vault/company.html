<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vault - Derek Wu</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b7cee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                    },
                },
            },
        }
    </script>

    <!-- marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="../../css/styles.css"/>
    <style>
        /* Heading highlight animation */
        .heading-highlight {
            position: relative;
            display: inline-block;
            padding: 0.125rem 0.375rem;
            margin: -0.125rem -0.375rem;
            border-radius: 0.25rem;
            vertical-align: baseline;
        }
        .heading-highlight::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(43, 124, 238, 0.35);
            border-radius: 0.25rem;
            z-index: -1;
            animation: brush-highlight 0.8s ease-out;
            transform-origin: left;
        }
        .dark .heading-highlight::before {
            background-color: rgba(43, 124, 238, 0.45);
        }
        @keyframes brush-highlight {
            0%   { transform: scaleX(0); opacity: 0.8; }
            60%  { transform: scaleX(1); opacity: 1; }
            100% { transform: scaleX(1); opacity: 0; }
        }

        /* Markdown content styles */
        .markdown-content h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #111418;
            margin-bottom: 1.5rem;
            padding-bottom: 0.25rem;
        }
        .dark .markdown-content h2 { color: white; }
        .markdown-content h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #111418;
            margin-bottom: 0.75rem;
            margin-top: 1.25rem;
        }
        .dark .markdown-content h3 { color: white; }
        .markdown-content p {
            color: #637588;
            line-height: 1.7;
            margin-bottom: 1rem;
        }
        .dark .markdown-content p { color: #9ca3af; }
        .markdown-content ul, .markdown-content ol {
            color: #637588;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }
        .dark .markdown-content ul, .dark .markdown-content ol { color: #9ca3af; }
        .markdown-content li { margin-bottom: 0.25rem; line-height: 1.7; }
        .markdown-content ul li { list-style-type: disc; }
        .markdown-content ol li { list-style-type: decimal; }
        .markdown-content strong { color: #111418; font-weight: 600; }
        .dark .markdown-content strong { color: white; }
        .markdown-content a { color: #2b7cee; text-decoration: underline; }
        .markdown-content blockquote {
            border-left: 3px solid #2b7cee;
            padding-left: 1rem;
            margin: 1rem 0;
            color: #637588;
            font-style: italic;
        }
        .dark .markdown-content blockquote { color: #9ca3af; }
        .content-section {
            padding-bottom: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-[#111418] dark:text-white font-display overflow-x-hidden antialiased">

<main class="flex-1 flex flex-col items-center w-full">

        </div>
    </section>

    <!-- Main Content Area -->
    <section class="w-full max-w-[1200px] px-6 lg:px-16 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">

            <!-- Left: Main Content -->
            <div class="lg:col-span-8">
                <!-- Header -->

                    <p id="company-description" class="text-lg text-[#637588] dark:text-gray-400 leading-relaxed"></p>
                </div>

            <!-- Right: TOC Sidebar -->

                        <div class="flex items-center justify-between mb-4">

                            <button
                                id="scroll-to-top"

                                title="Scroll to top"

                            </button>
                        </div>
                        <nav id="toc-nav" class="space-y-1"></nav>

                </div>
            </div>

        </div>
    </section>

    <!-- Back Button -->
    <section class="w-full max-w-[1200px] px-6 lg:px-16 pb-20">
        <a href="../vault.html" class="inline-flex items-center px-6 py-3 bg-white dark:bg-[#1a2634] border border-[#e5e7eb] dark:border-gray-800 rounded-lg text-[#111418] dark:text-white font-semibold hover:border-primary transition-all">
            <span class="material-symbols-outlined mr-2">arrow_back</span>
            Back to Vault
        </a>
    </section>
</main>

<!-- Footer -->
<footer class="w-full border-t border-[#f0f2f4] dark:border-gray-800 bg-white dark:bg-[#1a2634] py-8">
    <div class="max-w-[1200px] mx-auto px-6 lg:px-10 flex flex-col md:flex-row justify-between items-center gap-4">
        <p class="text-sm text-[#637588] dark:text-gray-400">© 2025 Derek Wu. All rights reserved.</p>

            <a href="https://www.linkedin.com/in/derekjongwu/" target="_blank" rel="noopener noreferrer" class="text-[#637588] dark:text-gray-400 hover:text-primary transition-colors">LinkedIn</a>

    </div>
</footer>

<script src="../../js/main.js"></script>
<script src="../../js/vault-auth.js"></script>

<script>
// Auth check
(function() {
    function checkAuth() {
        const authStatus = sessionStorage.getItem('vault_authenticated');
        const authTimestamp = sessionStorage.getItem('vault_auth_timestamp');
        if (authStatus !== 'true' || !authTimestamp) {
            window.location.href = '../vault.html';
            return;
        }
        const SESSION_TIMEOUT = 30 * 60 * 1000;
        if (Date.now() - parseInt(authTimestamp, 10) > SESSION_TIMEOUT) {
            sessionStorage.removeItem('vault_authenticated');
            sessionStorage.removeItem('vault_auth_timestamp');
            window.location.href = '../vault.html';
        }
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', checkAuth);
    } else {
        checkAuth();
    }
})();

// Sector → color mapping
const SECTOR_COLORS = {
    'Cybersecurity':  { pill: 'bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300',     rounded: 'rounded-full' },
    'AI':             { pill: 'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300',   rounded: 'rounded-full' },
    'Fintech':        { pill: 'bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-300', rounded: 'rounded-full' },
    'Healthcare':     { pill: 'bg-teal-50 dark:bg-teal-900/30 text-teal-700 dark:text-teal-300',   rounded: 'rounded-full' },
    'SaaS':           { pill: 'bg-purple-50 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300', rounded: 'rounded-full' },
    'Enterprise':     { pill: 'bg-orange-50 dark:bg-orange-900/30 text-orange-700 dark:text-orange-300', rounded: 'rounded-full' },
    'Consumer':       { pill: 'bg-pink-50 dark:bg-pink-900/30 text-pink-700 dark:text-pink-300',   rounded: 'rounded-full' },
    'Developer Tools':   { pill: 'bg-violet-50 dark:bg-violet-900/30 text-violet-700 dark:text-violet-300', rounded: 'rounded-full' },
    'Legal Tech':        { pill: 'bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300',  rounded: 'rounded-full' },
    'Legal Tech / AI':   { pill: 'bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300',  rounded: 'rounded-full' },
    'AI Safety / Trust':            { pill: 'bg-sky-50 dark:bg-sky-900/30 text-sky-700 dark:text-sky-300',    rounded: 'rounded-full' },
    'Cybersecurity / PQC':          { pill: 'bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300',       rounded: 'rounded-full' },
    'Cybersecurity / SaaS':         { pill: 'bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300',       rounded: 'rounded-full' },
    'Developer Tools / Infrastructure': { pill: 'bg-violet-50 dark:bg-violet-900/30 text-violet-700 dark:text-violet-300', rounded: 'rounded-full' },
    'AI Infrastructure':            { pill: 'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300',   rounded: 'rounded-full' },
};
const STATUS_COLORS = {
    'Sourced':         'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300',
    'Diligenced':      'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300',
    'Presented to IC': 'bg-purple-50 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300',
    'Not Invested':    'bg-orange-50 dark:bg-orange-900/30 text-orange-700 dark:text-orange-300',
    'Invested':        'bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-300',
    'Passed':          'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400',
    'Seed':            'bg-teal-50 dark:bg-teal-900/30 text-teal-700 dark:text-teal-300',
    'Series A':        'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300',
    'Series B':        'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300',
    'Series C':        'bg-purple-50 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300',
    'Series D':        'bg-violet-50 dark:bg-violet-900/30 text-violet-700 dark:text-violet-300',
};
const DEFAULT_PILL = 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400';

function parseMeta(text) {
    const lines = text.split('\n');
    const meta = {};
    let contentStart = 0;
    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith('## ') || line.startsWith('### ')) { contentStart = i; break; }
        if (!line) continue;
        const colonIdx = line.indexOf(':');
        if (colonIdx > 0) {
            meta[line.substring(0, colonIdx).trim()] = line.substring(colonIdx + 1).trim();
        }
    }
    return { meta, content: lines.slice(contentStart).join('\n') };
}

async function loadCompany() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    if (!slug) { window.location.href = '../vault.html'; return; }

    // Fetch manifest to get exact filename (handles spaces, uppercase extensions)
    let filename = slug + '.md';
    try {
        const mRes = await fetch('../../data/vault/manifest.json');
        if (mRes.ok) {
            const manifest = await mRes.json();
            const entry = manifest.find(c => c.slug === slug);
            if (entry && entry.file) filename = entry.file;
        }
    } catch (_) {}

    let text;
    try {
        const res = await fetch(`../../data/vault/${encodeURIComponent(filename)}`);
        if (!res.ok) throw new Error('Not found');
        text = await res.text();
    } catch (e) {
        window.location.href = '../vault.html';
        return;
    }

    const { meta, content } = parseMeta(text);
    const name = meta['Company Name'] || slug;
    const description = meta['Brief Description'] || '';
    const allTags = (meta['Tags'] || '').split(',').map(t => t.trim()).filter(Boolean);
    const sector = allTags[0] || '';
    const statusTags = allTags.slice(1);

    // Page title + header text
    document.title = `${name} - Vault - Derek Wu`;
    document.getElementById('company-name').textContent = name;
    document.getElementById('breadcrumb-name').textContent = name;
    document.getElementById('company-description').textContent = description;

    // Build tag badges
    const tagContainer = document.getElementById('tag-container');
    if (sector) {
        const c = SECTOR_COLORS[sector] || { pill: DEFAULT_PILL, rounded: 'rounded-full' };
        tagContainer.insertAdjacentHTML('beforeend',
            `<span class="inline-flex items-center px-3 py-1 ${c.rounded} ${c.pill} text-sm font-medium">${sector}</span>`);
    }
    statusTags.forEach(tag => {
        const cls = STATUS_COLORS[tag] || DEFAULT_PILL;
        tagContainer.insertAdjacentHTML('beforeend',
            `<span class="inline-flex items-center px-3 py-1 rounded-md ${cls} text-xs font-medium">${tag}</span>`);
    });

    // Render markdown and extract headings (support both ## and ###)
    let html = marked.parse(content);
    const headings = [];

    // Strip any IDs that marked may have already added, then add our own
    html = html.replace(/<h([23])(?:\s[^>]*)?>(.*?)<\/h\1>/gi, (_, level, headingText) => {
        const cleanText = headingText.replace(/<[^>]*>/g, '').trim();
        const id = cleanText.toLowerCase().replace(/[^\w]+/g, '-').replace(/^-|-$/g, '');
        if (level === '2' || level === '3') headings.push({ text: cleanText, id });
        return `<h${level} id="${id}">${headingText}</h${level}>`;
    });

    // Wrap each section in a div for scroll tracking
    const parts = html.split(/(?=<h[23] id=")/);
    const wrappedHtml = parts.map((part, i) => {
        if (i === 0 && !part.match(/^<h[23]/)) return part;
        const idMatch = part.match(/^<h[23] id="([^"]+)"/);
        const id = idMatch ? idMatch[1] : `section-${i}`;
        return `<div class="content-section" data-section="${id}">${part}</div>`;
    }).join('');

    document.getElementById('markdown-content').innerHTML = wrappedHtml;

    // Build TOC
    const tocNav = document.getElementById('toc-nav');
    headings.forEach((h, i) => {
        tocNav.insertAdjacentHTML('beforeend', `
            <a href="#${h.id}"
               class="toc-link block px-3 py-2 text-sm rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors ${i === 0 ? 'text-primary font-semibold' : 'text-[#637588] dark:text-gray-400 hover:text-primary dark:hover:text-primary'}"
               data-section="${h.id}">${h.text}</a>`);
    });

    // TOC click handler
    tocNav.querySelectorAll('.toc-link').forEach(link => {
        link.addEventListener('click', e => {
            e.preventDefault();
            const target = document.getElementById(link.dataset.section);
            if (target) {
                window.scrollTo({ top: target.offsetTop - 100, behavior: 'smooth' });
                setTimeout(() => {
                    const h2 = target.closest ? target : target.querySelector('h2') || target;
                    h2.classList.remove('heading-highlight');
                    void h2.offsetWidth;
                    h2.classList.add('heading-highlight');
                    setTimeout(() => h2.classList.remove('heading-highlight'), 800);
                }, 300);
            }
        });
    });

    // Scroll-to-top button
    document.getElementById('scroll-to-top').addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Active TOC link on scroll
    const tocLinks = tocNav.querySelectorAll('.toc-link');
    function updateActiveTOC() {
        const scrollY = window.scrollY + 150;
        const sections = document.querySelectorAll('.content-section[data-section]');
        let active = sections[0]?.dataset.section;
        sections.forEach(sec => {
            if (scrollY >= sec.offsetTop) active = sec.dataset.section;
        });
        tocLinks.forEach(link => {
            const isActive = link.dataset.section === active;
            link.classList.toggle('text-primary', isActive);
            link.classList.toggle('font-semibold', isActive);
            link.classList.toggle('text-[#637588]', !isActive);
            link.classList.toggle('dark:text-gray-400', !isActive);
        });
    }
    window.addEventListener('scroll', updateActiveTOC);
    updateActiveTOC();
}

document.addEventListener('DOMContentLoaded', loadCompany);
</script>
</body>
</html>
